name: Continuous Auto Game Developer (Groq version)

on:
  workflow_dispatch: # 手動・外部API実行用

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install groq

    - name: Run Auto Improver
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python generate_game.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        # コミットする変更があるか確認
        if ! git diff --cached --exit-code; then
          git commit -m "Auto-improve game to itch.io level"
          git push origin main
        else
          echo "No improvements to commit this time."
        fi
